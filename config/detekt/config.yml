config:
  validation: true

naming:
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'

complexity:
  LongParameterList:
    ignoreDefaultParameters: true
  TooManyFunctions:
    ignoreAnnotatedFunctions: [ 'Preview' ]

style:
  MagicNumber:
    ignorePropertyDeclaration: true
  UnusedPrivateFunction:
    ignoreAnnotated: [ 'Preview', 'PreviewTablet' ]

Compose:
  CompositionLocalAllowlist:
    allowedCompositionLocals: [ 'LocalColorScheme' ]
  MultipleEmitters:
    contentEmittersDenylist: [ 'TextFieldDialog' ]

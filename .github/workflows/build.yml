name: "build"

on:
  push:
    branches:
      - trunk
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: ZacSweers/kempt@main
        with:
          cache: true
      - run: ./gradlew build
